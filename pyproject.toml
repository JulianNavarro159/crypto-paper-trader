[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-paper-trader"
version = "0.1.0"
description = "Production-grade real-time cryptocurrency paper trading pipeline for Binance Spot"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
